version: v1
# Add a language by adding a plugin here. out: is relative to the protogen repo root (cwd at generate time).
plugins:
  - plugin: buf.build/protocolbuffers/go:v1.36.6
    out: go
    opt: paths=source_relative
  - plugin: buf.build/grpc/go:v1.5.1
    out: go
    opt: paths=source_relative
