name: Verify and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      skip_release: ${{ steps.gate.outputs.skip_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and build
        run: bash scripts/verify.sh

      - name: Breaking change check
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bump == 'major') }}
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            echo "No previous semver tag; skipping buf breaking"
            exit 0
          fi
          BUF_BREAKING_AGAINST=".git#tag=${latest}" bash scripts/verify.sh

      - name: Release gate
        id: gate
        run: |
          set -euo pipefail
          echo "skip_release=false" >> "${GITHUB_OUTPUT}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "skip_release=true" >> "${GITHUB_OUTPUT}"
            echo "reason=pull_request" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "${existing}" ]; then
            echo "skip_release=true" >> "${GITHUB_OUTPUT}"
            echo "reason=head_already_tagged" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "${before}" ] && [ "${before}" != "0000000000000000000000000000000000000000" ]; then
              if ! git diff --name-only "${before}" "${GITHUB_SHA}" | grep -Eq '(^|/)[^/]+\.proto$|^buf\.yaml$|^buf\.gen\.yaml$'; then
                echo "skip_release=true" >> "${GITHUB_OUTPUT}"
                echo "reason=no_contract_changes" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
            fi
          fi

          echo "reason=release" >> "${GITHUB_OUTPUT}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Verify proto"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Release | ${{ steps.gate.outputs.skip_release == 'true' && 'skipped' || 'will tag' }} |"
            echo "| Reason | ${{ steps.gate.outputs.reason }} |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    needs: verify
    if: needs.verify.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      release_url: ${{ steps.bump.outputs.release_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create tag
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            tag="v0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "${BUMP}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "unknown bump: ${BUMP}" >&2
                exit 1
                ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi

          echo "Creating ${tag} (bump=${BUMP}, previous=${latest:-none})"
          url="$(gh release create "${tag}" --generate-notes --target "${GITHUB_SHA}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "previous=${latest:-none}" >> "${GITHUB_OUTPUT}"
          echo "release_url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Proto release"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Result | ${{ job.status }} |"
            echo "| Tag | \`${{ steps.bump.outputs.tag }}\` |"
            echo "| Previous | \`${{ steps.bump.outputs.previous }}\` |"
            echo "| Bump | ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }} |"
            echo "| URL | ${{ steps.bump.outputs.release_url || '—' }} |"
            echo "| Next | notify job (workflow_call) |"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/notify-protogen.yml
    with:
      proto_ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
